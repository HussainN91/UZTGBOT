# One rented server, four pieces, nothing exotic.
#
#   Telegram  →  Caddy (TLS, renewed automatically)
#                  ↓
#             web  +  worker
#                  ↓
#               postgres
#
# The same file runs locally and on the server. Locally, Caddy is unnecessary —
# start just the pieces you need:
#
#   docker compose up postgres web worker
#
# On the server, bring up everything:
#
#   docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Bounded on purpose. Docker's default json-file driver grows without limit,
    # and this stack logs every inbound message. On a 50 GB disk that is a slow
    # disk-full outage which takes PostgreSQL down with it.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mopse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mopse}
      # Deterministic collation. Left to the host locale, an OS upgrade can
      # change sort order underneath existing indexes and corrupt them silently.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published on loopback only. Nothing reaches the database from outside the
    # host; the port is here so you can attach psql over an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mopse} -d ${POSTGRES_DB:-mopse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    # Bounded on purpose. Docker's default json-file driver grows without limit,
    # and this stack logs every inbound message. On a 50 GB disk that is a slow
    # disk-full outage which takes PostgreSQL down with it.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    command: ["node", "dist/web/main.js"]
    env_file: [.env]
    environment:
      TZ: Asia/Tashkent
      # Resolve IPv4 before IPv6 when talking to Telegram.
      #
      # api.telegram.org publishes both an A and an AAAA record, and this server
      # has no IPv6 route at all. Left to itself Node sometimes picks the IPv6
      # address, tries to reach something unreachable, and then waits out the
      # operating system's TCP connect timeout before falling back.
      #
      # Measured on 3 August 2026, from inside this container: 100 calls with the
      # default order produced a median of 214ms and two pathological calls, one
      # hanging 20 seconds and one failing after 60. Forty calls with this flag
      # produced none, and a better p90 (287ms against 406ms). Every reply the
      # bot sends goes down this path, so a bad roll is a teacher waiting a full
      # minute for a message that normally takes a fifth of a second.
      #
      # Nothing is given up by forcing IPv4 here, because there is no working
      # IPv6 on this host to prefer. Remove it if the server ever gains one.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
    # Not published. Only Caddy reaches it, over the compose network.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    # Bounded on purpose. Docker's default json-file driver grows without limit,
    # and this stack logs every inbound message. On a 50 GB disk that is a slow
    # disk-full outage which takes PostgreSQL down with it.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    command: ["node", "dist/worker/main.js"]
    env_file: [.env]
    environment:
      TZ: Asia/Tashkent
      # Same reason as the web service above. The worker sends every digest,
      # every announcement and every reminder, so it makes more Telegram calls
      # than the web process does.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy obtains and renews the certificate itself. Port 80 is required for
    # the ACME challenge and for the redirect to HTTPS — it is not optional.
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Must match PUBLIC_URL's hostname in .env, without the scheme.
      BOT_HOSTNAME: ${BOT_HOSTNAME:?set BOT_HOSTNAME in .env, e.g. bot.example.uz}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
